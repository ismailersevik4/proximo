# Fabrique l'APK Proximo, la signe et la publie dans « Releases » (tag android).
# L'appli vérifie proximo-apk.json dans cette Release pour proposer la mise à jour.
name: APK Proximo
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/apk.yml", "signing/**"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Compiler
        run: gradle assembleRelease --no-daemon --warning-mode=summary
      - name: Signer
        # La clé est dans le dépôt, chiffrée (signing/proximo.jks.enc). Seul le secret ANDROID_KEYSTORE_PASS l'ouvre.
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "Secret ANDROID_KEYSTORE_PASS manquant (Settings > Secrets and variables > Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS -in signing/proximo.jks.enc -out /tmp/release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks /tmp/release.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias proximo --out Proximo.apk aligned.apk
          rm -f /tmp/release.jks
          $BT/apksigner verify --print-certs Proximo.apk | tee certs.txt
          grep -qi "SHA-256 digest: $(tr -d ': \t' < signing/empreinte-sha256.txt | sed 's/SHA256//I' | tr 'A-F' 'a-f')" certs.txt && echo "Même clé que prévu : OK" || { echo "Clé différente !"; exit 1; }
          ls -la Proximo.apk
      - uses: actions/upload-artifact@v4
        with: { name: Proximo-apk, path: Proximo.apk }
      - name: Publier dans « Releases »
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          CODE=$(grep -o 'val appVersionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*$')
          NAME=$(grep -o 'val appVersionName = "[^"]*"' app/build.gradle.kts | sed 's/.*= "//; s/"//')
          echo "{\"code\":$CODE,\"name\":\"$NAME\"}" > proximo-apk.json; cat proximo-apk.json
          gh release delete android --yes --cleanup-tag || true
          gh release create android Proximo.apk proximo-apk.json --title "Proximo $NAME (APK $CODE)" --notes "Dernière version de Proximo. Téléchargez Proximo.apk sur le téléphone puis installez-le. Ensuite, les mises à jour se font depuis l'appli." --latest
